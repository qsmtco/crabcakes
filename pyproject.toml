[project]
name = "crabcakes"
version = "0.1.0"
description = "GTK4 AI-native project development environment for OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.48",
    "websockets>=12.0",
    "cryptography>=41.0",
    "GitPython>=3.1",
    "tiktoken>=0.7",  # Phase CB-4: accurate token estimation for trim decisions (BUG #5 fix)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ui/*", "gateway/*", "agent/*", "utils/*", "models/*", "prompts/*"]
